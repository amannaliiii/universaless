<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universaless Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #fff; font-family: 'Segoe UI', sans-serif; padding-top: 70px; padding-bottom: 70px; }

        /* Navbar */
        .app-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid #1f2833; }
        .app-logo { color: #22c55e; font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .search-btn { background: #1f2833; border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }

        /* Grid - Responsive Logic */
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .section-title { font-size: 22px; margin-bottom: 20px; color: #f3f4f6; }
        .grid { display: grid; gap: 20px; }
        
        /* Mobile: 2 columns */
        .grid { grid-template-columns: repeat(2, 1fr); }
        
        /* Laptop/Desktop: 5 columns */
        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(5, 1fr); }
            .card img { height: 280px !important; }
        }

        .card { background: #161b22; border-radius: 12px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { font-size: 14px; padding: 10px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1f2833; z-index: 100; }
        .nav-item { color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #22c55e; }

        /* Player */
        #player { display: none; position: fixed; inset: 0; background: #000; z-index: 999; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: red; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; z-index: 1000; }
        iframe { width: 100%; height: 100vh; border: none; }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-logo">UNIVERSALESS</div>
        <button class="search-btn" onclick="openSearch()">Search</button>
    </div>

    <div class="container">
        <h2 class="section-title" id="pageTitle">Trending Now</h2>
        <div class="grid" id="movieGrid"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadTab('popular', this, 'Trending Now')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="loadTab('hi', this, 'Hindi')"><span>🇮🇳</span>Hindi</div>
        <div class="nav-item" onclick="loadTab('en', this, 'Hollywood')"><span>🇺🇸</span>Movies</div>
        <div class="nav-item" onclick="loadMusic(this)"><span>🎵</span>Music</div>
    </div>

    <div id="player">
        <button class="close-btn" onclick="closePlayer()">Close</button>
        <iframe id="vidFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = '4150581ccf3ec551c12884bbf92d041d';
        const proxyBase = 'https://gentle-rice-b132.adnanal8466.workers.dev';

        async function fetchMovies(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p>Loading...</p>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                render(data.results);
            } catch (e) {
                grid.innerHTML = '<p>Error loading movies.</p>';
            }
        }

        function render(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach(m => {
                if(!m.poster_path) return;
                grid.innerHTML += `
                    <div class="card" onclick="play(${m.id})">
                        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}">
                        <h3>${m.title}</h3>
                    </div>`;
            });
        }

        function loadTab(type, el, title) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = title;
            let url = `${proxyBase}/3/movie/popular?api_key=${apiKey}`;
            if(type === 'hi') url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=hi`;
            if(type === 'en') url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=en`;
            fetchMovies(url);
        }

        function loadMusic(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = 'My Playlist';
            document.getElementById('movieGrid').innerHTML = `<iframe src="https://www.youtube.com/embed/videoseries?list=RDsZLEuUDx1eA" style="width:100%; height:400px; border-radius:10px;" allowfullscreen></iframe>`;
        }

        async function openSearch() {
            const q = prompt("Movie name:");
            if(q) fetchMovies(`${proxyBase}/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}`);
        }

        function play(id) {
            document.getElementById('vidFrame').src = `https://multiembed.mov/?video_id=${id}&tmdb=1`;
            document.getElementById('player').style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('vidFrame').src = '';
            document.getElementById('player').style.display = 'none';
        }

        fetchMovies(`${proxyBase}/3/movie/popular?api_key=${apiKey}`);
    </script>
</body>
</html>
