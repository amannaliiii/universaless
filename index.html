<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universaless | Desktop Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #fff; font-family: sans-serif; padding-top: 70px; }

        .app-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; border-bottom: 1px solid #1f2833; z-index: 100; }
        .app-logo { color: #22c55e; font-size: 22px; font-weight: 900; letter-spacing: 1px; cursor: pointer; }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-link { color: #9ca3af; font-size: 14px; font-weight: 600; cursor: pointer; background: none; border: none; padding: 6px 12px; border-radius: 6px; transition: 0.2s; }
        .nav-link:hover, .nav-link.active { color: #22c55e; background: #1f2833; }
        
        .lang-select { background: #1f2833; border: 1px solid #374151; color: white; padding: 6px 12px; border-radius: 6px; font-size: 14px; outline: none; cursor: pointer; }
        .lang-select:focus { border-color: #22c55e; }

        .search-box { background: #1f2833; border: 1px solid #374151; color: white; padding: 8px 15px; border-radius: 8px; font-size: 14px; outline: none; width: 220px; }
        .search-box:focus { border-color: #22c55e; }

        .container { padding: 20px 40px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #161b22; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #1f2833; }
        .card:hover { transform: scale(1.03); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: #22c55e; }
        .card img { width: 100%; height: 280px; object-fit: cover; }
        .card h3 { font-size: 14px; padding: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e5e7eb; }

        #player { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 999; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; background: #14151a; padding: 12px 25px; border-bottom: 1px solid #1f2833; }
        .servers { display: flex; gap: 10px; }
        .server-btn { background: #1f2833; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .server-btn:hover { background: #374151; }
        .server-btn.active-server { background: #22c55e; color: #000; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 8px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { background: #dc2626; }
        
        iframe { width: 100%; height: calc(100vh - 60px); border: none; background: #000; }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-logo" onclick="loadTab('popular', document.querySelector('.nav-link'))">UNIVERSALESS</div>
        <div class="nav-links">
            <button class="nav-link active" onclick="loadTab('popular', this)">Trending Hollywood</button>
            
            <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
                <option value="all">🌍 All Languages</option>
                <option value="hi">🇮🇳 Hindi Dubbed / Audio</option>
                <option value="en">🇺🇸 Hollywood Original (English)</option>
            </select>

            <input type="text" class="search-box" id="searchInput" placeholder="Search movies..." onkeypress="handleSearch(event)">
        </div>
    </div>

    <div class="container">
        <div class="grid" id="movieGrid"></div>
    </div>

    <div id="player">
        <div class="player-header">
            <div class="servers">
                <button class="server-btn active-server" onclick="changeServer(1, this)">Server 1 (Vidsrc.to)</button>
                <button class="server-btn" onclick="changeServer(2, this)">Server 2 (2Embed)</button>
                <button class="server-btn" onclick="changeServer(3, this)">Server 3 (Vidsrc.su Multi-Audio)</button>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ Close</button>
        </div>
        <iframe id="vidFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = '4150581ccf3ec551c12884bbf92d041d';
        const proxyBase = 'https://gentle-rice-b132.adnanal8466.workers.dev';
        let currentMovieId = null;

        async function fetchMovies(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#22c55e; font-size:18px; padding:40px;">Loading...</p>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';
                data.results.forEach(m => {
                    if(m.poster_path) {
                        grid.innerHTML += `<div class="card" onclick="play(${m.id})"><img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h3>${m.title}</h3></div>`;
                    }
                });
            } catch(e) { grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:red; padding:40px;">Error loading movies.</p>'; }
        }

        function loadTab(type, el) {
            document.querySelectorAll('.nav-link').forEach(i => i.classList.remove('active'));
            if(el) el.classList.add('active');
            document.getElementById('langSelect').value = 'all';
            fetchMovies(`${proxyBase}/3/movie/popular?api_key=${apiKey}`);
        }

        function changeLanguage(lang) {
            document.querySelectorAll('.nav-link').forEach(i => i.classList.remove('active'));
            let url = `${proxyBase}/3/movie/popular?api_key=${apiKey}`;
            if(lang === 'hi') {
                url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=hi`;
            } else if(lang === 'en') {
                url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=en`;
            }
            fetchMovies(url);
        }

        function handleSearch(e) {
            if(e.key === 'Enter') {
                const q = e.target.value.trim();
                if(q) fetchMovies(`${proxyBase}/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}`);
            }
        }

        function play(id) {
            currentMovieId = id;
            document.getElementById('vidFrame').src = `https://vidsrc.to/embed/movie/${id}`;
            document.getElementById('player').style.display = 'flex';
            
            document.querySelectorAll('.server-btn').forEach((b, idx) => {
                if(idx === 0) b.classList.add('active-server');
                else b.classList.remove('active-server');
            });
        }

        function changeServer(serverNum, el) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-server'));
            el.classList.add('active-server');

            if(serverNum === 1) {
                document.getElementById('vidFrame').src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else if(serverNum === 2) {
                document.getElementById('vidFrame').src = `https://www.2embed.cc/embed/${currentMovieId}`;
            } else if(serverNum === 3) {
                document.getElementById('vidFrame').src = `https://vidsrc.su/embed/movie/${currentMovieId}`;
            }
        }

        function closePlayer() {
            document.getElementById('vidFrame').src = '';
            document.getElementById('player').style.display = 'none';
        }

        fetchMovies(`${proxyBase}/3/movie/popular?api_key=${apiKey}`);
    </script>
</body>
</html>
