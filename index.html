<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universaless</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #ffffff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #161b22; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { color: #22c55e; text-align: center; margin-bottom: 20px; font-weight: 900; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0b0c10; border: 1px solid #374151; color: white; border-radius: 8px; outline: none; font-size: 14px; }
        button { width: 100%; background: #22c55e; color: black; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; }
        button:hover { background: #16a34a; }
        .footer-links { text-align: center; margin-top: 15px; font-size: 13px; }
        .footer-links a { color: #f87171; text-decoration: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>UNIVERSALESS</h2>
        <input type="text" id="loginEmail" placeholder="Email or Username" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button onclick="handleLogin()">Sign In</button>
        <div class="footer-links">
            <p>New to Universaless? <a href="https://instagram.com/vscode.hustler" target="_blank">Follow on IG</a></p>
            <p style="margin-top: 8px;"><a href="index.html">← Back to Home</a></p>
        </div>
    </div>

    <script>
        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if(!email || !pass) {
                alert('Please enter email and password.');
                return;
            }
            // Save user session
            localStorage.setItem('universaless_user', email);
            alert('Welcome back, ' + email + '!');
            // Redirect to main OTT page
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
