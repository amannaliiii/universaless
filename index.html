<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universaless - OTT Streaming</title>
    <!-- Tailwind CSS CDN for quick and modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* Hide scrollbar for clean horizontal rows */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 w-full z-50 bg-gradient-to-b from-black/80 to-transparent px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-8">
            <h1 class="text-2xl font-bold text-red-600 tracking-wider">UNIVERSALESS</h1>
            <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-300">
                <a href="#" class="hover:text-white transition">Home</a>
                <a href="#" class="hover:text-white transition">Movies</a>
                <a href="#" class="hover:text-white transition">Series</a>
                <a href="#" class="hover:text-white transition">My List</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <button class="bg-red-600 hover:bg-red-700 px-4 py-1.5 rounded text-sm font-semibold transition">Login</button>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="relative h-[70vh] flex items-center px-6 md:px-12 bg-cover bg-center" style="background-image: linear-gradient(to top, #141414, rgba(20,20,20,0.4)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');">
        <div class="max-w-xl space-y-4 mt-20">
            <span class="bg-red-600 text-xs font-bold px-2.5 py-1 rounded uppercase tracking-widest">Trending #1</span>
            <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight">Cyber Heist 2026</h2>
            <p class="text-gray-300 text-sm md:text-base line-clamp-3">Ek high-stakes thriller jahan hackers ki team digital world ko badalne ke liye sabse bada attack plan karti hai.</p>
            <div class="flex space-x-4 pt-2">
                <button class="bg-white text-black hover:bg-gray-200 px-6 py-2.5 rounded font-bold flex items-center space-x-2 transition">
                    <span>▶ Play Now</span>
                </button>
                <button class="bg-gray-600/70 hover:bg-gray-600 px-6 py-2.5 rounded font-bold text-white backdrop-blur transition">
                    ℹ More Info
                </button>
            </div>
        </div>
    </section>

    <!-- Movie Rows Section -->
    <main class="px-6 md:px-12 py-8 space-y-8">
        <!-- Row 1: Trending Now -->
        <div>
            <h3 class="text-xl font-semibold mb-4 text-gray-200">Trending Now</h3>
            <div class="flex space-x-4 overflow-x-auto no-scrollbar pb-4">
                <!-- Card 1 -->
                <div class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
                <!-- Card 2 -->
                <div class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
                <!-- Card 3 -->
                <div class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
                <!-- Card 4 -->
                <div class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
            </div>
        </div>
    </main>

</body>
</html>
