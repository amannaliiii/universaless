<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universaless App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0c10; color: #fff; font-family: 'Segoe UI', sans-serif; padding-top: 60px; padding-bottom: 70px; overflow-x: hidden; }

        .app-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 100; border-bottom: 1px solid #1f2833; }
        .app-logo { color: #22c55e; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
        .search-btn { background: #1f2833; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }

        .container { padding: 10px; }
        .section-title { font-size: 18px; font-weight: bold; margin: 10px 0 15px 5px; color: #f3f4f6; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #161b22; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.5); cursor: pointer; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e5e7eb; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1f2833; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #22c55e; }
        .nav-item span { font-size: 20px; margin-bottom: 3px; }

        #player { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; justify-content: center; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,0,0,0.8); color: white; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; z-index: 1000; cursor: pointer; }
        iframe { width: 100%; height: 100vh; border: none; }
        
        .error-msg { grid-column: 1/-1; text-align: center; padding: 20px; background: #1f2833; border-radius: 10px; border: 1px solid red; }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-logo">UNIVERSALESS</div>
        <button class="search-btn" onclick="openSearch()">🔍 Search</button>
    </div>

    <div class="container">
        <h2 class="section-title" id="pageTitle">Trending Now</h2>
        <div class="grid" id="movieGrid"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadTab('popular', this, 'Trending Now')"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="loadTab('hi', this, 'Hindi Movies')"><span>🇮🇳</span>Hindi</div>
        <div class="nav-item" onclick="loadTab('en', this, 'Hollywood')"><span>🇺🇸</span>Movies</div>
        <div class="nav-item" onclick="loadMusic(this)"><span>🎵</span>Music</div>
    </div>

    <div id="player">
        <button class="close-btn" onclick="closePlayer()">✕ Close</button>
        <iframe id="vidFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = '4150581ccf3ec551c12884bbf92d041d';
        const proxyBase = 'https://gentle-rice-b132.adnanal8466.workers.dev';

        async function fetchMovies(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p style="color:#22c55e; text-align:center; grid-column:1/-1; font-size:16px;">Movies Data Fetching... ⏳</p>';
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Server Error Code: ${res.status}`);
                
                const data = await res.json();
                if(data.results && data.results.length > 0) {
                    render(data.results);
                } else {
                    grid.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Koi movie nahi mili.</p>';
                }
            } catch (e) {
                console.error(e);
                grid.innerHTML = `
                    <div class="error-msg">
                        <h3 style="color:red; margin-bottom:10px;">⚠️ Connection Error!</h3>
                        <p style="font-size:12px; color:#e5e7eb; margin-bottom:5px;">${e.message}</p>
                        <p style="font-size:12px; color:#9ca3af;">Please check your internet connection.</p>
                    </div>`;
            }
        }

        function render(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            movies.forEach(m => {
                if(!m.poster_path) return;
                grid.innerHTML += `
                    <div class="card" onclick="play(${m.id})">
                        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}">
                        <h3>${m.title}</h3>
                    </div>`;
            });
        }

        function loadTab(type, el, title) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = title;
            
            let url = `${proxyBase}/3/movie/popular?api_key=${apiKey}`;
            if(type === 'hi') url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=hi`;
            if(type === 'en') url = `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=en`;
            fetchMovies(url);
        }

        function loadMusic(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('pageTitle').innerText = 'My Playlist';
            document.getElementById('movieGrid').innerHTML = `
                <div style="grid-column: 1/-1;">
                    <iframe src="https://www.youtube.com/embed/videoseries?list=RDsZLEuUDx1eA" style="width:100%; height:250px; border-radius:10px;" allowfullscreen></iframe>
                </div>`;
        }

        async function openSearch() {
            const q = prompt("Enter movie name:");
            if(q) {
                document.getElementById('pageTitle').innerText = `Search: ${q}`;
                fetchMovies(`${proxyBase}/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}`);
            }
        }

        function play(id) {
            const videoUrl = `https://multiembed.mov/?video_id=${id}&tmdb=1`;
            document.getElementById('vidFrame').src = videoUrl;
            document.getElementById('player').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('vidFrame').src = '';
            document.getElementById('player').style.display = 'none';
        }

        fetchMovies(`${proxyBase}/3/movie/popular?api_key=${apiKey}`);
    </script>
</body>
</html>
