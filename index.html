<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universaless | Desktop Premium</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        
        /* Desktop Top Navigation */
        .desktop-nav { background: #000; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #22c55e; }
        .logo { color: #22c55e; font-size: 32px; font-weight: 900; letter-spacing: 2px; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 30px; font-weight: 600; cursor: pointer; }
        .nav-links a:hover { color: #22c55e; }

        /* Widescreen Grid */
        .container { padding: 40px 50px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 25px; }
        .card { background: #111; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
        .card:hover { transform: scale(1.03); border-color: #22c55e; }
        .card img { width: 100%; height: 320px; object-fit: cover; }
        .card h3 { padding: 15px; text-align: center; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Modal */
        #player-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; padding: 50px; }
        .close-btn { position: absolute; top: 20px; right: 20px; color: white; background: red; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        iframe { width: 100%; height: 90vh; border: none; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="desktop-nav">
        <div class="logo">UNIVERSALESS</div>
        <div class="nav-links">
            <a onclick="fetchMovies(popularUrl)">Home</a>
            <a onclick="loadTab('hi')">Hindi</a>
            <a onclick="loadTab('en')">Hollywood</a>
            <a onclick="openSearch()">🔍 Search</a>
        </div>
    </div>

    <div class="container">
        <div class="grid" id="movieGrid"></div>
    </div>

    <div id="player-overlay">
        <button class="close-btn" onclick="closePlayer()">CLOSE [X]</button>
        <iframe id="vidFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = '4150581ccf3ec551c12884bbf92d041d';
        const proxyBase = 'https://gentle-rice-b132.adnanal8466.workers.dev';
        const popularUrl = `${proxyBase}/3/movie/popular?api_key=${apiKey}`;

        async function fetchMovies(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p>Loading movies...</p>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';
                data.results.forEach(m => {
                    if(m.poster_path) {
                        grid.innerHTML += `
                            <div class="card" onclick="play(${m.id})">
                                <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
                                <h3>${m.title}</h3>
                            </div>`;
                    }
                });
            } catch(e) { grid.innerHTML = '<p>Error loading content.</p>'; }
        }

        function loadTab(type) {
            let url = (type === 'hi') ? `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=hi` : `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=en`;
            fetchMovies(url);
        }

        function openSearch() {
            const q = prompt("Search for a movie:");
            if(q) fetchMovies(`${proxyBase}/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}`);
        }

      function play(id) {
            // vidsrc.to is better for iframe embedding
            const videoUrl = `https://vidsrc.to/embed/movie/${id}`;
            document.getElementById('vidFrame').src = videoUrl;
            document.getElementById('player-overlay').style.display = 'block';
        }

        function closePlayer() {
            document.getElementById('vidFrame').src = '';
            document.getElementById('player-overlay').style.display = 'none';
        }

        fetchMovies(popularUrl);
    </script>
</body>
</html>
