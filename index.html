<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universaless - OTT Streaming</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 w-full z-50 bg-gradient-to-b from-black/80 to-transparent px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-8">
            <h1 class="text-2xl font-bold text-red-600 tracking-wider">UNIVERSALESS</h1>
            <nav class="hidden md:flex space-x-6 text-sm font-medium text-gray-300">
                <a href="#" class="hover:text-white transition">Home</a>
                <a href="#" class="hover:text-white transition">Movies</a>
                <a href="#" class="hover:text-white transition">Series</a>
                <a href="#" class="hover:text-white transition">My List</a>
            </nav>
        </div>
        <div class="flex items-center space-x-4">
            <button class="bg-red-600 hover:bg-red-700 px-4 py-1.5 rounded text-sm font-semibold transition">Login</button>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="relative h-[70vh] flex items-center px-6 md:px-12 bg-cover bg-center" style="background-image: linear-gradient(to top, #141414, rgba(20,20,20,0.4)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');">
        <div class="max-w-xl space-y-4 mt-20">
            <span class="bg-red-600 text-xs font-bold px-2.5 py-1 rounded uppercase tracking-widest">Trending #1</span>
            <h2 class="text-4xl md:text-6xl font-extrabold tracking-tight">Cyber Heist 2026</h2>
            <p class="text-gray-300 text-sm md:text-base line-clamp-3">Ek high-stakes thriller jahan hackers ki team digital world ko badalne ke liye sabse bada attack plan karti hai.</p>
            <div class="flex space-x-4 pt-2">
                <button onclick="openPlayer('https://vidsrc.xyz/embed/movie/tt0111161')" class="bg-white text-black hover:bg-gray-200 px-6 py-2.5 rounded font-bold flex items-center space-x-2 transition cursor-pointer">
                    <span>▶ Play Now</span>
                </button>
                <button class="bg-gray-600/70 hover:bg-gray-600 px-6 py-2.5 rounded font-bold text-white backdrop-blur transition">
                    ℹ More Info
                </button>
            </div>
        </div>
    </section>

    <!-- Movie Rows Section -->
    <main class="px-6 md:px-12 py-8 space-y-8">
        <div>
            <h3 class="text-xl font-semibold mb-4 text-gray-200">Trending Now</h3>
            <div class="flex space-x-4 overflow-x-auto no-scrollbar pb-4">
                <!-- Card 1 -->
                <div onclick="openPlayer('https://vidsrc.xyz/embed/movie/tt0468569')" class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
                <!-- Card 2 -->
                <div onclick="openPlayer('https://vidsrc.xyz/embed/movie/tt0816692')" class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
                <!-- Card 3 -->
                <div onclick="openPlayer('https://vidsrc.xyz/embed/movie/tt1375666')" class="min-w-[200px] md:min-w-[240px] h-[135px] md:h-[140px] bg-gray-800 rounded-lg overflow-hidden flex-shrink-0 cursor-pointer hover:scale-105 transition transform duration-300">
                    <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80" class="w-full h-full object-cover" alt="Movie">
                </div>
            </div>
        </div>
    </main>

    <!-- Functional Video Player Modal (Hidden by default) -->
    <div id="videoModal" class="fixed inset-0 z-50 bg-black/90 hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-4xl flex justify-end mb-2">
            <button onclick="closePlayer()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded cursor-pointer transition">✕ Close Player</button>
        </div>
        <div class="w-full max-w-4xl h-[70vh] bg-black rounded-lg overflow-hidden shadow-2xl border border-gray-800">
            <iframe id="videoFrame" src="" class="w-full h-full border-0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- JavaScript to Handle Streaming & Player -->
    <script>
        function openPlayer(streamUrl) {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoFrame');
            iframe.src = streamUrl; // Load the streaming link dynamically
            modal.classList.remove('hidden');
        }

        function closePlayer() {
            const modal = document.getElementById('videoModal');
            const iframe = document.getElementById('videoFrame');
            iframe.src = ""; // Stop the video when closed
            modal.classList.add('hidden');
        }
    </script>

</body>
</html>
