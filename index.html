<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universaless</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0c10; color: #fff; font-family: sans-serif; padding-top: 60px; padding-bottom: 70px; overflow-x: hidden; }

        .app-bar { position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; border-bottom: 1px solid #1f2833; z-index: 100; }
        .app-logo { color: #22c55e; font-size: 20px; font-weight: 900; }
        .search-btn { background: #1f2833; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }

        .container { padding: 10px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #161b22; border-radius: 10px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e5e7eb; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #14151a; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1f2833; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 11px; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: #22c55e; }

        #player { display: none; position: fixed; inset: 0; background: #000; z-index: 999; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; background: #14151a; padding: 10px 15px; border-bottom: 1px solid #1f2833; }
        .servers { display: flex; gap: 8px; }
        .server-btn { background: #1f2833; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .server-btn.active-server { background: #22c55e; color: #000; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        iframe { width: 100%; height: calc(100vh - 50px); border: none; background: #000; }
    </style>
</head>
<body>

    <div class="app-bar">
        <div class="app-logo">UNIVERSALESS</div>
        <button class="search-btn" onclick="openSearch()">🔍 Search</button>
    </div>

    <div class="container">
        <div class="grid" id="movieGrid"></div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="loadTab('popular', this)"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="loadTab('hi', this)"><span>🇮🇳</span>Hindi</div>
        <div class="nav-item" onclick="loadTab('en', this)"><span>🇺🇸</span>Movies</div>
        <div class="nav-item" onclick="loadMusic(this)"><span>🎵</span>Music</div>
    </div>

    <div id="player">
        <div class="player-header">
            <div class="servers">
                <button class="server-btn active-server" onclick="changeServer(1, this)">Server 1</button>
                <button class="server-btn" onclick="changeServer(2, this)">Server 2</button>
                <button class="server-btn" onclick="changeServer(3, this)">Server 3</button>
            </div>
            <button class="close-btn" onclick="closePlayer()">✕ Close</button>
        </div>
        <iframe id="vidFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const apiKey = '4150581ccf3ec551c12884bbf92d041d';
        const proxyBase = 'https://gentle-rice-b132.adnanal8466.workers.dev';
        let currentMovieId = null;

        async function fetchMovies(url) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#22c55e;">Loading...</p>';
            try {
                const res = await fetch(url);
                const data = await res.json();
                grid.innerHTML = '';
                data.results.forEach(m => {
                    if(m.poster_path) {
                        grid.innerHTML += `<div class="card" onclick="play(${m.id})"><img src="https://image.tmdb.org/t/p/w500${m.poster_path}"><h3>${m.title}</h3></div>`;
                    }
                });
            } catch(e) { grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:red;">Error loading movies.</p>'; }
        }

        function loadTab(type, el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            let url = (type === 'hi') ? `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=hi` : (type === 'en') ? `${proxyBase}/3/discover/movie?api_key=${apiKey}&with_original_language=en` : `${proxyBase}/3/movie/popular?api_key=${apiKey}`;
            fetchMovies(url);
        }

        function loadMusic(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('movieGrid').innerHTML = `<div style="grid-column: 1/-1;"><iframe src="https://www.youtube.com/embed/videoseries?list=RDsZLEuUDx1eA" style="width:100%; height:250px; border-radius:10px;" allowfullscreen></iframe></div>`;
        }

        function openSearch() {
            const q = prompt("Enter movie name:");
            if(q) fetchMovies(`${proxyBase}/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(q)}`);
        }

        function play(id) {
            currentMovieId = id;
            // Default Server 1 load karega
            document.getElementById('vidFrame').src = `https://vidsrc.to/embed/movie/${id}`;
            document.getElementById('player').style.display = 'flex';
            
            // Reset active button styling
            document.querySelectorAll('.server-btn').forEach((b, idx) => {
                if(idx === 0) b.classList.add('active-server');
                else b.classList.remove('active-server');
            });
        }

        function changeServer(serverNum, el) {
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active-server'));
            el.classList.add('active-server');

            if(serverNum === 1) {
                document.getElementById('vidFrame').src = `https://vidsrc.to/embed/movie/${currentMovieId}`;
            } else if(serverNum === 2) {
                document.getElementById('vidFrame').src = `https://vidsrc.cc/v2/embed/movie/${currentMovieId}`;
            } else if(serverNum === 3) {
                document.getElementById('vidFrame').src = `https://multiembed.mov/?video_id=${currentMovieId}&tmdb=1`;
            }
        }

        function closePlayer() {
            document.getElementById('vidFrame').src = '';
            document.getElementById('player').style.display = 'none';
        }

        fetchMovies(`${proxyBase}/3/movie/popular?api_key=${apiKey}`);
    </script>
</body>
</html>
