<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Universaless</title>
    <style>
        :root {
            --bg-color: #0f1014;
            --card-bg: #1a1c23;
            --accent-color: #e50914;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #222;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            outline: none;
            font-size: 16px;
        }
        .input-group input:focus {
            border-color: var(--accent-color);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            opacity: 0.9;
        }
        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .footer-text a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">UNIVERSALESS</div>
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="email">Email or Username</label>
                <input type="text" id="email" required placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <div class="footer-text">
            <p>New to Universaless? <a href="https://instagram.com/vscode.hustler" target="_blank">Follow on IG</a></p>
            <p style="margin-top: 10px;"><a href="index.html">&larr; Back to Home</a></p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Welcome back, ${email}! (Login simulated successfully)`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
